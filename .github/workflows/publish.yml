name: Publish to npm

# Runs whenever a version tag like "v0.1.0" or "v1.2.3" is pushed.
# To release a new version:
#   1. Bump "version" in packages/cli/package.json (and root package.json, for consistency)
#   2. Update CHANGELOG.md
#   3. Commit, then tag and push:
#        git tag v0.1.0
#        git push origin v0.1.0
on:
  push:
    tags:
      - "v*.*.*"

  # Allows triggering a publish manually from the Actions tab, in case a tag
  # push is ever missed or a re-publish is needed.
  workflow_dispatch:

jobs:
  publish:
    name: Build & publish @abjad-org/research-chef
    runs-on: ubuntu-latest

    # Required for npm's "provenance" attestation (see step below), which
    # cryptographically links the published package back to this exact
    # workflow run and commit.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify package version matches the pushed tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            echo "Update packages/cli/package.json to match the tag before publishing."
            exit 1
          fi
          echo "Tag version matches package.json version: $PKG_VERSION"

      - name: Publish to npm
        # --provenance requires the "id-token: write" permission above and
        # publishes with a signed attestation of how/where the package was
        # built, visible on the npm package page.
        run: npm publish --workspace=@abjad-org/research-chef --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}